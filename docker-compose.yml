version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./backend
    container_name: portfolio-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    networks:
      - portfolio-network

  # Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
    container_name: portfolio-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge